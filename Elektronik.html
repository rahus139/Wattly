<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elektronik | Wattly</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Pixelify+Sans:wght@400..700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
</head>
<body>
    <div class="head-container">
        <header>
        <a href="#" class="logo">Wattly</a>

        <button class="menu-toggle" type="button" aria-label="Buka menu" aria-controls="site-nav" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>

        <nav id="site-nav">
          <a href="index.html" class="menu">Home</a>
          <a href="About.html" class="menu">About</a>
          <a href="calculator.html" class="menu">Calculator</a>
          <a href="Elektronik.html" class="menu active">Elektronik</a>
          <a href="simulator.html" class="menu">Simulator</a>
        </nav>
        <button class="sidebar-backdrop" type="button" aria-label="Tutup menu"></button>
    </header>
    </div>
    <section class="home" id="home">
        <div class="alat-img">
            <img src="lampu.png" alt="Lampu" data-nama="Lampu" data-info="Perangkat penerangan yang mengubah energi listrik menjadi cahaya. Cocok digunakan untuk menerangi ruangan." data-daya="Sekitar 10-60 watt">
        </div>
        <div class="alat-img">
            <img src="charger.png" alt="Charger" data-nama="Charger" data-info="Alat yang mengisi ulang energi baterai pada ponsel atau perangkat elektronik lainnya." data-daya="Sekitar 5-30 watt">
        </div>
        <div class="alat-img">
            <img src="kipas.png" alt="Kipas" data-nama="Kipas" data-info="Perangkat elektronik yang memutar baling-baling untuk menghasilkan aliran udara dan membantu menyejukkan ruangan." data-daya="Sekitar 35-75 watt">
        </div>
        <div class="alat-img">
            <img src="tv.png" alt="Televisi" data-nama="Televisi" data-info="Perangkat elektronik untuk menampilkan gambar dan suara dari siaran, perangkat streaming, atau sumber media lainnya." data-daya="Sekitar 50-150 watt">
        </div>
        
    </section>

    <dialog class="info-modal" id="info-modal" aria-labelledby="info-title">
        <button class="modal-close" id="modal-close" type="button" aria-label="Tutup informasi">&times;</button>
        <h2 id="info-title"></h2>
        <p id="info-description"></p>
        <p class="modal-power"><strong>Perkiraan daya:</strong> <span id="info-power"></span></p>
    </dialog>

    <script>
        const infoModal = document.getElementById('info-modal');
        const modalClose = document.getElementById('modal-close');

        document.querySelectorAll('.alat-img img[data-nama]').forEach((image) => {
            image.setAttribute('tabindex', '0');
            image.addEventListener('click', () => {
                document.getElementById('info-title').textContent = image.dataset.nama;
                document.getElementById('info-description').textContent = image.dataset.info;
                document.getElementById('info-power').textContent = image.dataset.daya;
                infoModal.showModal();
            });
            image.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    image.click();
                }
            });
        });

        modalClose.addEventListener('click', () => infoModal.close());
        infoModal.addEventListener('click', (event) => {
            if (event.target === infoModal) infoModal.close();
        });
    </script>
    <script src="nav.js"></script>
</body>
</html>
